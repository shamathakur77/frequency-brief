name: Daily card

on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python tools/build_fonts.py
      - run: |
          python -m frequency_brief --location stockholm
          node frequency_brief/screenshot_card.js
      - run: |
          mkdir -p docs archive
          cp out/card.png docs/card.png
          cp out/card.png "archive/$(date -u +%Y-%m-%d).png"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/card.png archive
          git diff --staged --quiet || git commit -m "card: $(date -u +%Y-%m-%d)"
          git push
